<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1330" viewBox="0 0 2000 1330" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#44546A"/></marker></defs>
<rect width="2000" height="1330" fill="#fff"/>
<text x="40" y="55" font-size="32" font-weight="700" fill="#1A2238">CTX-01. Контекст системы MedPredict</text>
<text x="40" y="92" font-size="20" fill="#333">Обновлено 21.10.2026  |  Синий сплошной: реализованный frontend  |  Зелёный сплошной: backend (по его README)  |  Пунктир: планируется / подлежит согласованию</text>
<rect x="340" y="170" width="1310" height="790" fill="none" stroke="#8E9AB5" stroke-width="3"/>
<text x="362" y="206" font-size="22" font-weight="700" fill="#1A2238">MedPredict: граница учебного прототипа</text>
<circle cx="150.0" cy="352" r="20" fill="#EBF3FA" stroke="#44546A" stroke-width="3"/>
<path d="M150.0,372 V440 M110.0,395 H190.0 M150.0,440 L113.0,488 M150.0,440 L187.0,488" stroke="#44546A" stroke-width="3" fill="none"/>
<text x="150.0" y="522" font-size="20" text-anchor="middle" fill="#1A2238">Участник демо</text>
<rect x="400" y="295" width="500" height="260" rx="14" fill="#EBF3FA" stroke="#44546A" stroke-width="3"/>
<text x="650.0" y="385.5" font-size="21" text-anchor="middle" fill="#1A2238" font-weight="700">Frontend на React: реализован</text>
<text x="650.0" y="416.5" font-size="21" text-anchor="middle" fill="#1A2238">Ввод, валидация, состояния, KK / RU / EN</text>
<text x="650.0" y="447.5" font-size="21" text-anchor="middle" fill="#1A2238">Демо: фиксированные 134,2 мм рт. ст.</text>
<text x="650.0" y="478.5" font-size="21" text-anchor="middle" fill="#1A2238">Не результат обученной модели</text>
<rect x="1125" y="295" width="470" height="260" rx="14" fill="#E8F4EE" stroke="#3B6E57" stroke-width="3"/>
<text x="1360.0" y="370.0" font-size="21" text-anchor="middle" fill="#1A2238" font-weight="700">REST API на Spring Boot: в разработке</text>
<text x="1360.0" y="401.0" font-size="21" text-anchor="middle" fill="#1A2238">Валидация, сведения о модели, прогноз</text>
<text x="1360.0" y="432.0" font-size="21" text-anchor="middle" fill="#1A2238">Demo-профиль возвращает фиксированное</text>
<text x="1360.0" y="463.0" font-size="21" text-anchor="middle" fill="#1A2238">значение; обученной модели пока нет:</text>
<text x="1360.0" y="494.0" font-size="21" text-anchor="middle" fill="#1A2238">503 MODEL_UNAVAILABLE</text>
<rect x="1125" y="665" width="470" height="215" rx="14" fill="#FFF8EA" stroke="#7F5A2B" stroke-width="3" stroke-dasharray="9 6"/>
<text x="1360.0" y="733.0" font-size="21" text-anchor="middle" fill="#1A2238" font-weight="700">Три независимых модуля: ПЛАНИРУЮТСЯ</text>
<text x="1360.0" y="764.0" font-size="21" text-anchor="middle" fill="#1A2238">M1: числовая цель Diabetes</text>
<text x="1360.0" y="795.0" font-size="21" text-anchor="middle" fill="#1A2238">M2: оценка систолического АД (NHANES)</text>
<text x="1360.0" y="826.0" font-size="21" text-anchor="middle" fill="#1A2238">M3: прогноз глюкозы (PhysioNet)</text>
<rect x="1690" y="545" width="290" height="265" rx="14" fill="#FFF8EA" stroke="#7F5A2B" stroke-width="3" stroke-dasharray="9 6"/>
<text x="1835.0" y="607.0" font-size="21" text-anchor="middle" fill="#1A2238">Кандидаты данных</text>
<text x="1835.0" y="638.0" font-size="21" text-anchor="middle" fill="#1A2238">Diabetes, NHANES,</text>
<text x="1835.0" y="669.0" font-size="21" text-anchor="middle" fill="#1A2238">PhysioNet</text>
<text x="1835.0" y="700.0" font-size="21" text-anchor="middle" fill="#1A2238">Выбор и права</text>
<text x="1835.0" y="731.0" font-size="21" text-anchor="middle" fill="#1A2238">использования:</text>
<text x="1835.0" y="762.0" font-size="21" text-anchor="middle" fill="#1A2238">согласовать</text>
<rect x="1125" y="1060" width="470" height="150" rx="14" fill="#FFF8EA" stroke="#7F5A2B" stroke-width="3" stroke-dasharray="9 6"/>
<text x="1360.0" y="1111.0" font-size="21" text-anchor="middle" fill="#1A2238">Команда: подготовка данных, обучение</text>
<text x="1360.0" y="1142.0" font-size="21" text-anchor="middle" fill="#1A2238">и оценка (отдельный процесс)</text>
<text x="1360.0" y="1173.0" font-size="21" text-anchor="middle" fill="#1A2238">Артефактов моделей пока нет</text>
<rect x="400" y="1060" width="500" height="125" rx="14" fill="#EBF3FA" stroke="#44546A" stroke-width="3"/>
<text x="650.0" y="1114.0" font-size="21" text-anchor="middle" fill="#1A2238">PDF на устройстве пользователя</text>
<text x="650.0" y="1145.0" font-size="21" text-anchor="middle" fill="#1A2238">Экспорт готового результата</text>
<polyline points="255,420 400,420" fill="none" stroke="#44546A" stroke-width="2.6" marker-end="url(#a)"/>
<rect x="299.6" y="379" width="54.8" height="26" fill="#fff" opacity="0.92"/>
<text x="327" y="398" font-size="19" text-anchor="middle" fill="#1A2238">Ввод</text>
<polyline points="400,505 255,505" fill="none" stroke="#44546A" stroke-width="2.6" marker-end="url(#a)"/>
<rect x="223.2" y="521" width="197.6" height="26" fill="#fff" opacity="0.92"/>
<text x="322" y="540" font-size="19" text-anchor="middle" fill="#1A2238">Результат / ошибка</text>
<polyline points="900,375 1125,375" fill="none" stroke="#44546A" stroke-width="2.6" stroke-dasharray="9 6" marker-end="url(#a)"/>
<rect x="954.0" y="311" width="116.0" height="26" fill="#fff" opacity="0.92"/>
<text x="1012" y="330" font-size="19" text-anchor="middle" fill="#1A2238">GET / POST</text>
<rect x="943.8" y="337" width="136.39999999999998" height="26" fill="#fff" opacity="0.92"/>
<text x="1012" y="356" font-size="19" text-anchor="middle" fill="#1A2238">контракт API</text>
<polyline points="1125,500 900,500" fill="none" stroke="#44546A" stroke-width="2.6" stroke-dasharray="9 6" marker-end="url(#a)"/>
<rect x="938.7" y="516" width="146.6" height="26" fill="#fff" opacity="0.92"/>
<text x="1012" y="535" font-size="19" text-anchor="middle" fill="#1A2238">JSON / ошибки</text>
<polyline points="1360,555 1360,665" fill="none" stroke="#44546A" stroke-width="2.6" stroke-dasharray="9 6" marker-end="url(#a)"/>
<rect x="1381.4" y="593" width="177.2" height="26" fill="#fff" opacity="0.92"/>
<text x="1470" y="612" font-size="19" text-anchor="middle" fill="#1A2238">Выбранный модуль</text>
<polyline points="1360,1060 1360,880" fill="none" stroke="#44546A" stroke-width="2.6" stroke-dasharray="9 6" marker-end="url(#a)"/>
<rect x="1251.0" y="966" width="218.0" height="26" fill="#fff" opacity="0.92"/>
<text x="1360" y="985" font-size="19" text-anchor="middle" fill="#1A2238">Проверенный артефакт</text>
<rect x="1235.7" y="992" width="248.6" height="26" fill="#fff" opacity="0.92"/>
<text x="1360" y="1011" font-size="19" text-anchor="middle" fill="#1A2238">после обучения и оценки</text>
<polyline points="1835,810 1835,1135 1595,1135" fill="none" stroke="#44546A" stroke-width="2.6" stroke-dasharray="9 6" marker-end="url(#a)"/>
<rect x="1710.7" y="966" width="248.6" height="26" fill="#fff" opacity="0.92"/>
<text x="1835" y="985" font-size="19" text-anchor="middle" fill="#1A2238">Данные для исследования</text>
<polyline points="650,555 650,1060" fill="none" stroke="#44546A" stroke-width="2.6" marker-end="url(#a)"/>
<rect x="561.4" y="821" width="177.2" height="26" fill="#fff" opacity="0.92"/>
<text x="650" y="840" font-size="19" text-anchor="middle" fill="#1A2238">Снимок по явному</text>
<rect x="535.9" y="847" width="228.2" height="26" fill="#fff" opacity="0.92"/>
<text x="650" y="866" font-size="19" text-anchor="middle" fill="#1A2238">действию пользователя</text>
<text x="40" y="1262" font-size="19" fill="#1A2238">Ввод в демо никогда не используется для обучения. Реальных данных пациентов и клинического применения сверх текущей демонстрации нет.</text>
</svg>