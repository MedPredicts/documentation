<text x="92" y="1112" font-size="19" fill="#1A2238">Одна реализация PredictionModel обслуживает один выбранный модуль; три модуля — планируемые альтернативы, а не готовые сервисы.</text>
<text x="45" y="1470" font-size="19" fill="#1A2238">Ввод хранится только в памяти frontend: без localStorage / sessionStorage, аналитики и журналов приложения.</text>
